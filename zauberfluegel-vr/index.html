<meta charset="utf-8">
<title>Maries Zauberflügel</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ff7eb6">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap">
<style>
/* Layout: full-screen 3D world, kid-sized round "candy" buttons pinned to the edges, zero text */
:root{
  --sky:#bfe6ff;
  --rose:#ff7eb6;
  --gold:#ffc93c;
  --gold-deep:#d98a0c;
  --plum:#5b2a86;
  --cream:#fffaf3;
  --font-display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky)}
body{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--font-display);color:var(--plum)}
#game{position:fixed;inset:0;touch-action:none}
#game canvas{display:block;width:100%;height:100%}
#water{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(ellipse at 50% 40%,rgba(80,200,255,.05),rgba(20,90,180,.45))}
#hud{position:fixed;inset:0;pointer-events:none}
#hud button{pointer-events:auto}
.bubble{width:60px;height:60px;border-radius:50%;border:3px solid var(--gold);padding:0;cursor:pointer;touch-action:none;
  background:radial-gradient(circle at 35% 28%,#fff 0%,#fff6fb 45%,#ffd3e8 100%);
  box-shadow:0 4px 0 var(--gold-deep),0 8px 18px rgba(91,42,134,.25);
  font-size:32px;line-height:1;display:grid;place-items:center;color:var(--plum);transition:transform .12s,box-shadow .12s;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.bubble:active{transform:translateY(3px) scale(.95);box-shadow:0 1px 0 var(--gold-deep),0 4px 10px rgba(91,42,134,.25)}
.bubble:focus-visible{outline:4px solid var(--plum);outline-offset:3px}
.top-left{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 12px);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
#slots{display:flex;gap:4px}
.slot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:rgba(255,255,255,.55);border:2px dashed rgba(91,42,134,.35);box-sizing:border-box}
.slot span{filter:grayscale(1);opacity:.35;transition:all .4s}
.slot.found{border:3px solid #fff;background:var(--c);box-shadow:0 0 12px var(--c);animation:pop .6s}
.slot.found span{filter:none;opacity:1}
#stars{font-size:22px;background:rgba(255,255,255,.8);border-radius:999px;padding:2px 14px 2px 10px;display:flex;gap:6px;align-items:center;font-weight:800;font-variant-numeric:tabular-nums;border:3px solid var(--gold);color:var(--plum)}
.top-right{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;gap:8px}
.top-right .bubble{width:50px;height:50px;font-size:26px}
#forms{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:10px}
#forms .bubble.active{border-color:#fff;background:radial-gradient(circle at 35% 28%,#fff8d6,#ffd75e 60%,#f0a81c);box-shadow:0 0 0 4px var(--gold),0 0 22px 6px rgba(255,201,60,.8);transform:scale(1.12)}
#ctx{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 92px);display:flex;gap:12px}
#ctx .bubble{width:72px;height:72px;font-size:38px;animation:pop .35s}
#updown{position:absolute;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 182px);display:flex;flex-direction:column;gap:12px}
#updown #btnZap{font-size:34px}
#btnZap{position:relative}#btnZap.empty{opacity:.45}
#ammo{position:absolute;right:-6px;bottom:-6px;min-width:26px;padding:1px 6px;border-radius:14px;background:#5b2a86;color:#fff;font:800 15px/20px 'Baloo 2',system-ui,sans-serif;border:2px solid #ffc93c;pointer-events:none}
#updown .bubble{width:70px;height:70px;transition:opacity .25s,transform .12s}
#updown .bubble.dim{opacity:.35}
#updown svg{width:36px;height:36px}
.pulse{animation:pulse 1s ease-in-out infinite!important}
@keyframes pulse{50%{transform:scale(1.18);box-shadow:0 0 0 6px #fff,0 0 30px 10px rgba(255,126,182,.9)}}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
#joy{position:absolute;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.75);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff,#ffd3e8);border:3px solid var(--gold)}
#pointer{position:absolute;left:0;top:0;width:76px;height:76px;pointer-events:none;will-change:transform}
#pointer .ptr-bub{position:absolute;inset:14px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:radial-gradient(circle at 35% 28%,#fff,#fff6c8);border:3px solid var(--gold);box-shadow:0 0 18px 6px rgba(255,210,60,.7);font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;animation:pulse 1s ease-in-out infinite}
#ptrArrow{position:absolute;inset:0;width:76px;height:76px}
#ptrArrow path{transform:translate(18px,0)}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding-inline:max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(ellipse at 50% 30%,rgba(255,255,255,.15),rgba(255,160,210,.45) 70%,rgba(140,90,210,.55))}
#start h1{margin:0;text-align:center;line-height:.82;color:#fff;font-weight:800;letter-spacing:.01em;text-wrap:balance;
  text-shadow:0 3px 0 var(--rose),0 6px 0 var(--plum),0 12px 28px rgba(91,42,134,.45)}
#start h1 .a{display:block;font-size:clamp(40px,11vw,76px);color:var(--gold)}
#start h1 .b{display:block;font-size:clamp(52px,15vw,112px)}
#play{width:128px;height:128px;border-radius:50%;border:5px solid #fff;cursor:pointer;display:grid;place-items:center;padding:0;
  background:radial-gradient(circle at 35% 28%,#fff8d6,#ffd75e 55%,#f0a81c);box-shadow:0 7px 0 var(--gold-deep),0 0 50px 12px rgba(255,220,120,.7);animation:breathe 1.8s ease-in-out infinite}
#kiMic,#kiGo{font:800 20px 'Baloo 2',system-ui,sans-serif;color:#5b2a86;background:#fff6fb;border:3px solid var(--gold);border-radius:30px;padding:10px 22px;cursor:pointer}
#kiGo{background:#ffd75e;font-size:22px}
#kiMic[disabled]{opacity:.75;cursor:default}
#tagBig{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font:800 120px/1 'Baloo 2',system-ui,sans-serif;color:#ff4f93;-webkit-text-stroke:5px #fff;text-shadow:0 6px 18px rgba(91,42,134,.4);pointer-events:none;z-index:25}
@keyframes tagpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.9)}}
#tagBoard{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:calc(104px + env(safe-area-inset-top,0px));width:min(290px,38vw);height:auto;z-index:19;pointer-events:none}
#hearts{font-size:18px;letter-spacing:1px;margin-top:6px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
#danger{display:inline-block;margin-top:6px;font:800 15px 'Baloo 2',system-ui,sans-serif;color:#5b2a86;background:rgba(255,255,255,.85);border:2px solid var(--gold);border-radius:999px;padding:1px 10px}#danger.hot{background:#ffe0ea;border-color:#ff4f6e}
#hurtFlash{position:fixed;inset:0;pointer-events:none;z-index:30;box-shadow:inset 0 0 120px 40px rgba(255,40,80,.0)}#hurtFlash.on{animation:hurtfl .7s ease-out}@keyframes hurtfl{0%{box-shadow:inset 0 0 140px 60px rgba(255,40,80,.75)}100%{box-shadow:inset 0 0 140px 60px rgba(255,40,80,0)}}
#riddle{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:calc(100vw - 32px);background:rgba(255,250,243,.96);border:4px solid #ff7eb6;border-radius:28px;padding:10px 22px 12px;text-align:center;color:#5b2a86;z-index:22;pointer-events:none;box-shadow:0 8px 24px rgba(91,42,134,.25)}
#riddle .who{font:800 20px 'Baloo 2',system-ui,sans-serif}#riddle .q{font-size:44px;line-height:1.2;margin:4px 0}#riddle .hint{font:700 20px 'Baloo 2',system-ui,sans-serif}#riddle.shake{animation:mshake .45s}
#math{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:calc(100vw - 32px);background:rgba(255,250,243,.96);border:4px solid #ffc93c;border-radius:28px;padding:10px 22px 12px;text-align:center;color:#5b2a86;z-index:22;pointer-events:none;box-shadow:0 8px 24px rgba(91,42,134,.25)}
#math .locks{font-size:30px;letter-spacing:6px}#math .q{font-size:46px;line-height:1.2;margin:4px 0}#math .hint{font:700 18px 'Baloo 2',system-ui,sans-serif}
#math.shake{animation:mshake .45s}@keyframes mshake{0%,100%{transform:translateX(-50%)}25%{transform:translateX(calc(-50% - 12px))}75%{transform:translateX(calc(-50% + 12px))}}
#kiBox{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:min(560px,calc(100vw - 32px));background:rgba(255,250,243,.95);color:#5b2a86;border:3px solid #ff7eb6;border-radius:22px;padding:10px 16px;font:700 17px/1.35 'Baloo 2',system-ui,sans-serif;white-space:pre-line;text-align:center;pointer-events:none;z-index:20}
#ctx .bubble.num{font:800 46px/1 'Baloo 2',system-ui,sans-serif;color:#5b2a86}
#setBtn{font:800 18px 'Baloo 2',system-ui,sans-serif;color:#5b2a86;background:rgba(255,246,251,.9);border:3px solid var(--gold);border-radius:30px;padding:8px 20px;cursor:pointer}
#setBox{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(91,42,134,.35);padding:16px}
#setBox[hidden]{display:none}
#setBox .card{background:#fffaf3;border:4px solid #ff7eb6;border-radius:26px;padding:16px 18px;max-width:440px;width:100%;max-height:calc(100vh - 32px);overflow:auto;color:#5b2a86;font:700 17px/1.3 'Baloo 2',system-ui,sans-serif}
#setBox h2{margin:0 0 8px;font-size:24px}#setBox .row{margin:12px 0 0}#setBox .lbl{margin-bottom:6px}
#setBox .opts{display:flex;flex-wrap:wrap;gap:6px}#setBox .opts button{font:800 16px 'Baloo 2',system-ui,sans-serif;color:#5b2a86;background:#fff;border:2px solid #e3c9f0;border-radius:999px;padding:5px 13px;cursor:pointer}
#setBox .opts button.on{background:#ffd75e;border-color:#f0a81c}
#setBox .done{margin-top:16px;width:100%;font:800 20px 'Baloo 2',system-ui,sans-serif;color:#5b2a86;background:#ffd75e;border:3px solid #f0a81c;border-radius:30px;padding:8px;cursor:pointer}
#start .play-row{display:flex;gap:28px;align-items:center}
#playVR{width:128px;height:128px;border-radius:50%;border:5px solid #fff;cursor:pointer;font-size:62px;padding:0;background:radial-gradient(circle at 35% 28%,#fff,#ffd3e8 60%,#ff9fd0);box-shadow:0 7px 0 #c2508a,0 0 50px 12px rgba(255,160,210,.7);animation:breathe 1.8s ease-in-out infinite;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
#play svg{width:60px;height:60px;margin-left:10px}
@keyframes breathe{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.pulse,#play{animation:none!important}}
</style>

<div id="game"></div>
<div id="water"></div>
<div id="hud" hidden>
  <div class="top-left">
    <div id="slots"></div>
    <div id="stars"><span>⭐</span><span id="starN">0</span></div>
  </div>
  <div class="top-right">
    <button class="bubble" id="btnHelp" aria-label="Nochmal hören">🔊</button>
    <button class="bubble" id="btnHome" aria-label="Nach Hause">🏠</button>
  </div>
  <div id="ctx"></div>
  <div id="updown">
    <button class="bubble" id="btnZap" aria-label="Zaubern">🪄<span id="ammo">12</span></button>
    <button class="bubble" id="btnUp" aria-label="Hoch"><svg viewBox="0 0 24 24"><path d="M12 4l8 10h-5v6H9v-6H4z" fill="#ff7eb6" stroke="#5b2a86" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
    <button class="bubble" id="btnDown" aria-label="Runter"><svg viewBox="0 0 24 24"><path d="M12 20L4 10h5V4h6v6h5z" fill="#7ec8ff" stroke="#5b2a86" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
  </div>
  <div id="forms">
    <button class="bubble active" data-form="human" aria-label="Marie">👧</button>
    <button class="bubble" data-form="unicorn" aria-label="Einhorn">🦄</button>
    <button class="bubble" data-form="fairy" aria-label="Fee">🧚‍♀️</button>
    <button class="bubble" data-form="mermaid" aria-label="Meerjungfrau">🧜‍♀️</button>
  </div>
  <div id="joy" hidden><div id="knob"></div></div>
  <div id="pointer" hidden><div class="ptr-bub">🦋</div><svg id="ptrArrow" viewBox="0 0 40 40"><path d="M30 20L12 8v24z" fill="#ffd23a" stroke="#5b2a86" stroke-width="2.5" stroke-linejoin="round"/></svg></div>
</div>
<div id="start">
  <h1><span class="a">Maries</span><span class="b">Zauberflügel</span></h1>
  <div class="play-row"><button id="playVR" hidden aria-label="In VR spielen">🥽</button>
  <button id="play" aria-label="Spielen"><svg viewBox="0 0 24 24"><path d="M6 3.5v17l14-8.5z" fill="#fff" stroke="#5b2a86" stroke-width="1.4" stroke-linejoin="round"/></svg></button></div>
  <button id="kiGo" hidden>🎤 Mit sprechenden Figuren spielen</button>
  <button id="kiMic" hidden>🎤 Mit den Figuren sprechen</button>
  <button id="setBtn">⚙️ Einstellungen</button>
</div>
<div id="setBox" hidden><div class="card"><h2>⚙️ Einstellungen</h2><div id="setRows"></div><button class="done" id="setDone">Fertig</button></div></div>
<div id="kiBox" hidden></div>

<script src="three.min.js"></script>
<script>
(()=>{
'use strict';
/* ================= helpers ================= */
const TAU=Math.PI*2, V3=THREE.Vector3;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const damp=(k,dt)=>1-Math.exp(-k*dt);
function angLerp(a,b,t){const d=(((b-a+Math.PI)%TAU)+TAU)%TAU-Math.PI;return a+d*t}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const SR=mulberry(20261023); const sr=(a,b)=>a+SR()*(b-a);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const hd=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
let NOW=0;

/* ================= world shape ================= */
const WATER_Y=0, LAKE={x:240,z:-220,r:240}, WORLD_R=300, LAKE_FLOOR=-18;
// handy points in the sea, measured from the shore that faces the farm
const SEA_DIR=(()=>{const l=Math.hypot(LAKE.x,LAKE.z);return{x:-LAKE.x/l,z:-LAKE.z/l,px:LAKE.z/l,pz:-LAKE.x/l}})();
const seaPt=(fromShore,side=0)=>({x:LAKE.x+SEA_DIR.x*(LAKE.r-fromShore)+SEA_DIR.px*side,z:LAKE.z+SEA_DIR.z*(LAKE.r-fromShore)+SEA_DIR.pz*side});
const PAD={x:12,z:-4,r:9}, DINO={x:-13,z:13,r:6}, BUSH={x:7,z:17}, DOME={x:-118,z:-14}, NPC_P={x:-6,z:-22};
// the horse farm: two stable wings with 12 boxes each around a courtyard
// three courtyards one behind the other, each with two wings of 12 boxes = 72 boxes
const STABLE={x:-36,z:-28,n:12,bw:4.6,bd:5.5,yard:18,yards:3,pitch:33}, HOME={x:-36,z:-28};
const YARDS=[...Array(STABLE.yards)].map((_,i)=>({x:STABLE.x,z:STABLE.z-i*STABLE.pitch}));
const BOXES=[];YARDS.forEach((Y,yi)=>{for(let w=0;w<2;w++)for(let k=0;k<STABLE.n;k++){const x=Y.x+(k-(STABLE.n-1)/2)*STABLE.bw,z=Y.z+(w?1:-1)*(STABLE.yard/2+STABLE.bd/2);BOXES.push({x,z,w,yi,face:w?Math.PI:0})}});
const GARDEN={x:38,z:44}, PLAY={x:-38,z:34}, MEADOW={x:-100,z:62}, GROVE={x:78,z:118};
const ISLANDS=[{x:-70,y:28,z:-96,r:9},{x:22,y:40,z:-158,r:8},{x:-150,y:24,z:76,r:7},{x:150,y:32,z:70,r:7.5},{x:-30,y:50,z:135,r:6},{x:-175,y:36,z:-90,r:7}];
// pier: from the shore towards the lake centre
const PIER=(()=>{const dx=-LAKE.x,dz=-LAKE.z,l=Math.hypot(dx,dz);return{dx:dx/l,dz:dz/l,x:LAKE.x+dx/l*(LAKE.r+11),z:LAKE.z+dz/l*(LAKE.r+11)}})();
// sandy paths from the farm to every place, so there is always a road to follow
const PATHS=[[[2,6],[PIER.x,PIER.z]],[[-2,2],[-4,-28],[STABLE.x+30,STABLE.z]],[[-6,2],[-40,-6],[DOME.x+10,DOME.z+4]],[[8,12],[GARDEN.x,GARDEN.z-6]],[[-8,12],[PLAY.x+5,PLAY.z-3]],[[PLAY.x-4,PLAY.z+4],[MEADOW.x+8,MEADOW.z-4]],[[GARDEN.x+4,GARDEN.z+6],[GROVE.x-6,GROVE.z-10]]];
function segD(x,z,a,b){const vx=b[0]-a[0],vz=b[1]-a[1],t=clamp(((x-a[0])*vx+(z-a[1])*vz)/(vx*vx+vz*vz),0,1);return Math.hypot(x-a[0]-vx*t,z-a[1]-vz*t)}
function pathD(x,z){let d=1e9;for(const p of PATHS)for(let i=0;i<p.length-1;i++)d=Math.min(d,segD(x,z,p[i],p[i+1]));return d}
function hill(x,z){return Math.sin(x*0.045)*1.6+Math.cos(z*0.05)*1.4+Math.sin((x+z)*0.021)*2.2+Math.sin(x*0.13+1)*Math.cos(z*0.11)*0.5}
function terrainH(x,z){
  const d=Math.hypot(x,z);
  let h=2+hill(x,z)*0.75*smooth(20,38,d);
  h+=(Math.sin(x*0.021+0.7)*Math.cos(z*0.019)*4.5+Math.sin(z*0.033+x*0.011)*2)*smooth(55,110,d);  // rolling hills further out
  const fx=Math.max(Math.abs(x-STABLE.x)-31,0),fz=Math.max(Math.abs(z-(STABLE.z-STABLE.pitch))-18-STABLE.pitch,0);h=lerp(2,h,smooth(0,14,Math.hypot(fx,fz)));  // flat ground for the horse farm
  h+=smooth(WORLD_R-25,WORLD_R+25,d)*20;
  const dl=Math.hypot(x-LAKE.x,z-LAKE.z);
  const floor=LAKE_FLOOR+Math.sin(x*0.09)*1.1+Math.cos(z*0.08)*1.1+smooth(LAKE.r-40,LAKE.r-6,dl)*9;  // shallow shelf near the shore
  h=lerp(h,floor,1-smooth(LAKE.r-6,LAKE.r+10,dl));
  return h;
}
function inLake(x,z){return Math.hypot(x-LAKE.x,z-LAKE.z)<LAKE.r+12 && terrainH(x,z)<WATER_Y-0.05}
function groundAt(x,z,y=999){
  let g=terrainH(x,z);
  for(const I of ISLANDS){const top=I.y+1;if(y>=top-1.6&&(x-I.x)**2+(z-I.z)**2<(I.r-0.3)**2)g=Math.max(g,top)}
  return g;
}
const DOME_Y=terrainH(DOME.x,DOME.z), DOME_TOP=DOME_Y+5;

/* ================= renderer & scene ================= */
const host=document.getElementById('game');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
host.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,1,0.1,900);
function resize(){const w=host.clientWidth||innerWidth,h=host.clientHeight||innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const FOG_NORMAL=new THREE.Color(0xffe2f1), FOG_WATER=new THREE.Color(0x2a9fd6);
scene.fog=new THREE.Fog(FOG_NORMAL.clone(),120,440);

const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,

function updateCamera(dt){const P=player.pos;

  const distT=lerp({human:9,unicorn:13,fairy:6.5,mermaid:9,ride:11}[mode],7,cam.under);cam.dist=lerp(cam.dist,distT,damp(2,dt));

  const th=lerp({human:1.5,unicorn:2.8,fairy:0.8,mermaid:1.4,ride:2.6}[mode],0.9,cam.under);const tgt=new V3(P.x,P.y+th,P.z);

function villainStep(v,tg,sp,dt,noSafe){const dx=tg.x-v.pos.x,dz=tg.z-v.pos.z,d=Math.hypot(dx,dz);if(d<0.3)return 0;v.yaw=angLerp(v.yaw,Math.atan2(dx,dz),damp(4,dt));
  const nx=v.pos.x+Math.sin(v.yaw)*sp*dt,nz=v.pos.z+Math.cos(v.yaw)*sp*dt;if(inLake(nx,nz)||(!noSafe&&inSafe(nx,nz))||Math.hypot(nx,nz)>WORLD_R-20){v.wanderT=0;v.flee=Math.max(v.flee,1.2);return 0}
  v.pos.x=nx;v.pos.z=nz;return sp}
function updateVillains(dt){const P=player.pos,rpow=player.riding&&player.riding.power,onLand=!inLake(P.x,P.z)&&P.y<groundAt(P.x,P.z,P.y)+4,safe=inSafe(P.x,P.z);

  for(const b of badRexes){if(!b.alive)continue;b.flash-=dt;b.flee-=dt;b.wanderT-=dt;b.roarT-=dt;const d=hd(b.pos,P);
    if(hasP(player.riding,'heart')&&d<11){b.hp=1;zapHit(b,b.pos.clone().add(new V3(0,2,0)));continue}
    const chase=free&&d<28&&b.flee<=0&&state.netT<=0;let sp=0;
    if(b.flee>0){const aw=b.pos.clone().sub(P).setY(0).normalize().multiplyScalar(10);sp=villainStep(b,b.pos.clone().add(aw),6,dt)}
    else if(chase){if(b.roarT<=0){b.roarT=rnd(9,13);floatIcon('💢',b.pos.clone().add(new V3(0,5,0)),2,0.6,1.3);Voice.say(pickNew('rex',REX_LINES),{prio:0,who:'rex'})}sp=villainStep(b,P,Math.min(6,playerRun()*0.72)*DSP(),dt)}
    else{if(b.wanderT<=0){const q=landSpot(b.pos.x,b.pos.z,8,30);if(q)b.target.copy(q);b.wanderT=rnd(6,12)}sp=villainStep(b,b.target,1.8,dt)}
    if(chase&&d<3&&bumpCD<=0){bumpCD=3;b.flee=3;state.stunT=1.8;hurt();const push=P.clone().sub(b.pos).setY(0).normalize().multiplyScalar(13);player.vel.x+=push.x;player.vel.z+=push.z;player.vel.y+=5;
      floatIcon('💫',P.clone().add(new V3(0,2,0)),3,0.6,1);SFX.splash();say('rexBump',{prio:2});if(VR.on){buzz(0,1,200);buzz(1,1,200)}}
    b.pos.y=terrainH(b.pos.x,b.pos.z);b.mesh.position.copy(b.pos);b.mesh.rotation.y=b.yaw;animSimple(b,dt,sp);b.mesh.userData.inner.scale.setScalar(b.flash>0?1.12:1);
    b.mesh.visible=b.pos.distanceTo(CAMW)<130;placeShadow(b.shadow,b.pos.x,b.pos.y,b.pos.z,4)}
  for(const k of kobolds){if(!k.alive)continue;const u=k.mesh.userData,d=hd(k.pos,P);k.flash-=dt;k.flee-=dt;k.wanderT-=dt;k.netT-=dt;k.shoutT-=dt;let sp=0;
    const mine=state.captured&&state.captured.ship===k;
    if(!mine&&k.king)sp=kingStep(k,dt);
    else if(!mine&&k.raid&&k.flee<=0)sp=raiderStep(k,dt);
    else if(mine){const dc=hd(k.pos,KCAMP);if(dc>3)sp=villainStep(k,KCAMP,3.4,dt);else{k.yaw+=dt*2.5;sp=0}
      const back=new V3(-Math.sin(k.yaw),0,-Math.cos(k.yaw)).multiplyScalar(2.4);k.cagePos=new V3(k.pos.x+back.x,0,k.pos.z+back.z);k.cagePos.y=terrainH(k.cagePos.x,k.cagePos.z);
      if(k.shoutT<=0){k.shoutT=rnd(10,15);Voice.say(pickNew('kobCap',KOBOLD_CAP_LINES),{prio:0,who:'kobold'})}}
    else if(state.captured&&hd(k.pos,KCAMP)<40){const a=NOW*0.6+kobolds.indexOf(k)*1.7;sp=villainStep(k,new V3(KCAMP.x+Math.cos(a)*6,0,KCAMP.z+Math.sin(a)*6),2.5,dt)}

    else if(free&&d<48){sp=d>1.2?villainStep(k,P,Math.min(9.5,playerRun()*1.08)*DSP(),dt):0;if(!sp)k.yaw=angLerp(k.yaw,Math.atan2(P.x-k.pos.x,P.z-k.pos.z),damp(5,dt));
      if(k.shoutT<=0){k.shoutT=rnd(5,8);Voice.say(pickNew('kob',KOBOLD_LINES),{prio:0,who:'kobold'});floatIcon(pick(['😜','😝','😛']),k.pos.clone().add(new V3(0,2.4,0)),1,0.2,1.1)}

      k.stealCD=(k.stealCD||0)-dt;if(d<1.9&&k.stealCD<=0&&state.stars>0&&state.netT<=0){k.stealCD=12;state.stars--;k.stolen=(k.stolen||0)+1;updateStars();save();floatIcon('⭐',P.clone().add(new V3(0,2,0)),3,0.5,1.1);
        Voice.say(KOBOLD_STEAL,{prio:2,who:'kobold'});setTimeout(()=>say('starStolen',{prio:2}),2600);k.flee=6}
      // zielt dorthin, wo Marie gleich sein wird, und wirft schnell
      if(d<32&&k.netT<=0&&state.netT<=0){k.netT=rnd(2.8,4.2)/DSP();u.net.rotation.x=-1.2;const from=k.pos.clone().add(new V3(0,2,0)),T=Math.max(0.45,from.distanceTo(P)/28),to=P.clone().add(new V3(player.vel.x*T+rnd(-0.9,0.9),1,player.vel.z*T+rnd(-0.9,0.9)));
        const vel=to.clone().sub(from).divideScalar(T);vel.y+=0.5*14*T;const m=new THREE.Mesh(netMesh.geometry,netMesh.material);m.scale.setScalar(0.85);m.position.copy(from);scene.add(m);NETS.push({m,pos:from,vel,life:T+1,ship:k,r:3.5});SFX.jump()}}
